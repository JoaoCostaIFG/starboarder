services:
  starboarder:
    # Pinned version — Renovate opens PRs to bump this as new releases are
    # tagged. The published multi-arch image (linux/amd64 + linux/arm64)
    # carries matching semver tags (0.1.0, 0.1, 1) for every v* release.
    # `build: .` below makes `docker compose up --build` build locally instead;
    # for local builds against the latest code use tag `main` or `latest`.
    image: ghcr.io/joaocostaifg/starboarder:0.1.0
    build: .
    restart: unless-stopped
    env_file: .env
    mem_limit: 128m
    volumes:
      - starboarder-data:/app/data

    # ---------------------------------------------------------------------
    # Same-server variant (recommended when Fluxer runs in Docker on this
    # host): attach the bot to the Fluxer compose network and route to the
    # api/gateway containers directly instead of going through the public
    # origin. Verify the network name first:  docker network ls | grep fluxer
    # (the default self-hosting stack creates "fluxer_fluxer").
    #
    # Then set API_URL/GATEWAY_URL in your .env as well (they are harmless if
    # left set when you later detach from the network — the bot will just
    # fail to connect until you unset them).
    # ---------------------------------------------------------------------
    # networks: [fluxer_fluxer]

volumes:
  starboarder-data:

