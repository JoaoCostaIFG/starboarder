services:
  starboarder:
    build: .
    image: starboarder
    restart: unless-stopped
    env_file: .env
    mem_limit: 128m
    volumes:
      - starboarder-data:/app/data

    # ---------------------------------------------------------------------
    # Same-server variant (recommended when Fluxer runs in Docker on this
    # host): attach the bot to the Fluxer compose network and route to the
    # api/gateway containers directly instead of going through the public
    # origin. Verify the network name first:  docker network ls | grep fluxer
    # (the default self-hosting stack creates "fluxer_fluxer").
    #
    # Then comment out nothing above, uncomment the block below, and set
    # API_URL/GATEWAY_URL in your .env as well (they are harmless if left
    # set when you later detach from the network — the bot will just fail
    # to connect until you unset them).
    # ---------------------------------------------------------------------
    # networks: [fluxer_fluxer]

volumes:
  starboarder-data:

# networks:
#   fluxer_fluxer:
#     external: true
